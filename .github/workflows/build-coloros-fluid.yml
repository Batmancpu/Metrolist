name: Build Metrolist Fluid Cloud APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/coloros-fluid-cloud
    paths:
      - ".github/workflows/build-coloros-fluid.yml"
      - "app/**"
      - "innertube/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "*.gradle.kts"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ColorOS 15 APK
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Build package-renamed, updater-free APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleIzzyDebug --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.spotify.music
          METROLIST_APP_NAME: Metrolist Fluid
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: "false"

      - name: Verify package ID and prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep '/izzy/debug/' | head -n 1)"
          test -n "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.spotify.music'"
          mkdir -p dist
          cp "$APK" dist/Metrolist-Fluid-ColorOS15.apk
          sha256sum dist/Metrolist-Fluid-ColorOS15.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Metrolist-Fluid-ColorOS15
          path: dist/Metrolist-Fluid-ColorOS15.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: coloros-fluid-cloud-${{ github.run_number }}
          name: "Metrolist Fluid — ColorOS 15 build ${{ github.run_number }}"
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/Metrolist-Fluid-ColorOS15.apk
          body: |
            Experimental personal-use build of Metrolist with a Liquid Glass-inspired player surface and package ID `com.spotify.music` to test ColorOS 15 Fluid Cloud / Live Alerts recognition.

            - Uses the existing Media3 playback session; no separate MusicBridge listener service or notification-listener permission is added.
            - Uses the Izzy flavor so the built-in updater is disabled and cannot install incompatible upstream builds.
            - This is a debug-signed APK for device testing. The installation signature may differ from other builds.
            - Android permits only one installed app per package ID. Uninstall the official Spotify app first if it is installed; do not expect it to coexist.
            - On ColorOS, check the app's Battery usage settings and enable Allow background activity / unrestricted background use if available. Enable Fluid Cloud or Live Alerts for music in the system notification settings.
            - Fluid Cloud is controlled by OPPO's system-side allowlist and firmware. Package renaming is a testable compatibility strategy, not a guarantee on every regional build.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
