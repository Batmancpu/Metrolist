name: Build Metrolist Fluid for Obtainium

on:
  workflow_dispatch:
  push:
    branches:
      - feat/coloros-fluid-cloud
    paths:
      - ".github/workflows/build-coloros-fluid.yml"
      - "app/**"
      - "innertube/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "*.gradle.kts"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish Fluid Cloud prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Prepare temporary CI release signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"
          if [ ! -f "$RUNNER_TEMP/metrolist-fluid.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Metrolist Fluid CI,O=Metrolist,C=IN"
          fi

      - name: Build package-renamed, updater-free APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleIzzyRelease --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.spotify.music
          METROLIST_APP_NAME: Metrolist Fluid
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          METROLIST_BUILD_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: "false"
          METROLIST_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/metrolist-fluid.keystore

      - name: Verify package, version code, and prepare release asset
        shell: bash
        env:
          BUILD_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION_CODE=$((1000 + BUILD_RUN_NUMBER))
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep '/izzy/release/' | head -n 1)"
          test -n "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.spotify.music'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='$EXPECTED_VERSION_CODE'"
          mkdir -p dist
          cp "$APK" dist/Metrolist-Fluid-ColorOS15.apk
          sha256sum dist/Metrolist-Fluid-ColorOS15.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Metrolist-Fluid-ColorOS15
          path: dist/Metrolist-Fluid-ColorOS15.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: coloros-fluid-cloud-${{ github.run_number }}
          name: "Metrolist Fluid — ColorOS 15 build ${{ github.run_number }}"
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/Metrolist-Fluid-ColorOS15.apk
          body: |
            Personal-use prerelease of Metrolist Fluid. This build uses the non-debug, R8-optimized release variant so UI performance can be tested without debug-build overhead.

            - Package ID: `com.spotify.music`, verified during CI. This keeps the same package-based Fluid Cloud compatibility strategy already tested on device.
            - Uses the existing Media3 playback session and the updater-free Izzy variant.
            - No persistent signing secrets are required. Each clean CI run uses a temporary CI signing key for the optimized release APK.
            - Because the signing key changes between builds, Android will not install each build over the previous one. Uninstall the previous Metrolist Fluid prerelease before installing the new APK; uninstalling deletes that app's local data.
            - The version code increases with each CI run.
            - This package ID cannot coexist with the official Spotify app.
            - Fluid Cloud recognition remains controlled by ColorOS firmware and system settings; the package setup has already been tested on device.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
