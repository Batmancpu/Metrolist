name: Build Metrolist Fluid for Obtainium

on:
  workflow_dispatch:
  push:
    branches:
      - feat/coloros-fluid-cloud
    paths:
      - ".github/workflows/build-coloros-fluid.yml"
      - "app/**"
      - "innertube/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "*.gradle.kts"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish normal release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check persistent signing configuration
        id: signing_check
        shell: bash
        env:
          FLUID_KEYSTORE_BASE64: ${{ secrets.FLUID_KEYSTORE_BASE64 }}
          FLUID_KEYSTORE_PASSWORD: ${{ secrets.FLUID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$FLUID_KEYSTORE_BASE64" && -n "$FLUID_KEYSTORE_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=One-time setup required::Add repository Actions secrets FLUID_KEYSTORE_BASE64 and FLUID_KEYSTORE_PASSWORD, then run this workflow once. Gradle was not started."
          fi

      - name: Checkout source
        if: ${{ steps.signing_check.outputs.ready == 'true' }}
        uses: actions/checkout@v7

      - name: Set up JDK 21
        if: ${{ steps.signing_check.outputs.ready == 'true' }}
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        if: ${{ steps.signing_check.outputs.ready == 'true' }}
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Restore persistent signing key
        if: ${{ steps.signing_check.outputs.ready == 'true' }}
        shell: bash
        env:
          FLUID_KEYSTORE_BASE64: ${{ secrets.FLUID_KEYSTORE_BASE64 }}
          FLUID_KEYSTORE_PASSWORD: ${{ secrets.FLUID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$FLUID_KEYSTORE_BASE64" | base64 --decode > app/fluid-release.keystore
          keytool -list -keystore app/fluid-release.keystore -storepass "$FLUID_KEYSTORE_PASSWORD" -alias fluidrelease >/dev/null

      - name: Build package-renamed, updater-free APK
        if: ${{ steps.signing_check.outputs.ready == 'true' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleIzzyDebug --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.spotify.music
          METROLIST_APP_NAME: Metrolist Fluid
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          METROLIST_VERSION_CODE: ${{ 1000 + github.run_number }}
          METROLIST_DEBUG_KEYSTORE_PATH: fluid-release.keystore
          METROLIST_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.FLUID_KEYSTORE_PASSWORD }}
          METROLIST_DEBUG_KEY_ALIAS: fluidrelease
          METROLIST_DEBUG_KEY_PASSWORD: ${{ secrets.FLUID_KEYSTORE_PASSWORD }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: "false"

      - name: Verify package, version code, and prepare release asset
        if: ${{ steps.signing_check.outputs.ready == 'true' }}
        shell: bash
        env:
          EXPECTED_VERSION_CODE: ${{ 1000 + github.run_number }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep '/izzy/debug/' | head -n 1)"
          test -n "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.spotify.music'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='$EXPECTED_VERSION_CODE'"
          mkdir -p dist
          cp "$APK" dist/Metrolist-Fluid-ColorOS15.apk
          sha256sum dist/Metrolist-Fluid-ColorOS15.apk

      - name: Upload build artifact
        if: ${{ steps.signing_check.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: Metrolist-Fluid-ColorOS15
          path: dist/Metrolist-Fluid-ColorOS15.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish normal GitHub Release for Obtainium
        if: ${{ steps.signing_check.outputs.ready == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: coloros-fluid-cloud-${{ github.run_number }}
          name: "Metrolist Fluid — ColorOS 15 build ${{ github.run_number }}"
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/Metrolist-Fluid-ColorOS15.apk
          body: |
            Personal-use Metrolist fork build, published as a normal GitHub release so Obtainium can track it.

            - Package ID: `com.spotify.music`, verified during CI.
            - Uses Metrolist's existing Media3 session; no separate MusicBridge listener service or notification-listener permission is added.
            - Uses the updater-free Izzy variant to prevent an upstream updater from replacing this package.
            - Every build uses the same persistent signing key stored in repository Actions secrets; do not delete or replace those secrets if you want in-place updates.
            - The version code is generated from the GitHub Actions run number so each successful update is newer than the previous one.
            - The earlier prerelease was signed with a temporary CI key. Uninstall that earlier build before installing this first persistently signed release; uninstalling removes its app data.
            - This package ID matches Spotify, so it cannot coexist with the official Spotify app.
            - On ColorOS, enable Allow background activity / unrestricted background use if available. Fluid Cloud remains dependent on OPPO's system-side recognition and firmware.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
